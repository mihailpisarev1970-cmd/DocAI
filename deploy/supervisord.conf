; ═══════════════════════════════════════════════════════════════════════════
; DocAI — супервизор двух процессов в одном контейнере:
;   docai-backend — Django через gunicorn (порт 8000)
;   docai-bot     — Telegram-бот (aiogram, polling)
; ═══════════════════════════════════════════════════════════════════════════

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
nodaemon=true
user=docai
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:docai-backend]
command=gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -
directory=/app/backend
user=docai
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:docai-bot]
command=python main.py
directory=/app/bot
user=docai
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
