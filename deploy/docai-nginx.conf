# ═══════════════════════════════════════════════════════════════════════════
# DocAI — nginx на ХОСТЕ, проксирует на контейнер DocAI (127.0.0.1:8000)
# Домен: check.pisarev-n8n.ru
#
# Установка:
#   sudo cp docai-nginx.conf /etc/nginx/sites-available/docai
#   sudo ln -sf /etc/nginx/sites-available/docai /etc/nginx/sites-enabled/docai
#   sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: HTTPS-блок прописан явно. Если файл перезаписывается — сертификат
# certbot уже в /etc/letsencrypt/live/check.pisarev-n8n.ru/, ничего не потеряется.
# НЕ трогаем default и другие сайты.
# ═══════════════════════════════════════════════════════════════════════════

# --- HTTP: редирект на HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name check.pisarev-n8n.ru;
    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name check.pisarev-n8n.ru;

    ssl_certificate     /etc/letsencrypt/live/check.pisarev-n8n.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/check.pisarev-n8n.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/docai-access.log;
    error_log  /var/log/nginx/docai-error.log;

    client_max_body_size 25M;

    # --- Статика админки (Django отдаёт через api.static_serve) ---
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health/;
        proxy_set_header Host $host;
    }
}
