# ═══════════════════════════════════════════════════════════════════════════
# DocAI — Docker Compose
#
# Запуск:   docker compose up -d --build
# Логи:     docker logs -f DocAI
# Стоп:     docker compose down
#
# Контейнер называется DocAI (container_name ниже).
# Наружу порт не публикуется: nginx на хосте проксирует на 127.0.0.1:8000.
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL — база данных DocAI
  # ═══════════════════════════════════════════════════════════════════════
  docai-db:
    image: postgres:16-alpine
    container_name: DocAI-DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-docai}
      POSTGRES_USER: ${DB_USER:-docai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    volumes:
      - docai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-docai} -d ${DB_NAME:-docai}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - docai_net

  # ═══════════════════════════════════════════════════════════════════════
  # DocAI — backend + bot
  # ═══════════════════════════════════════════════════════════════════════
  docai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docai:latest
    container_name: DocAI
    restart: unless-stopped
    depends_on:
      docai-db:
        condition: service_healthy

    # Порт доступен только локально — наружу его отдаёт nginx на хосте
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ../backend/.env
      - ../bot/.env

    environment:
      TZ: Europe/Moscow
      # Параметры подключения к PostgreSQL
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-docai}
      DB_USER: ${DB_USER:-docai}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_HOST: docai-db
      DB_PORT: "5432"

    volumes:
      - docai_data:/app/data
      - ../backend/logs:/app/backend/logs
      # Конфиги монтируем с хоста, чтобы можно было менять без пересборки
      - ../backend/.env:/app/backend/.env:ro
      - ../bot/.env:/app/bot/.env:ro

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - docai_net

volumes:
  docai_data:
    name: docai_data
  docai_pgdata:
    name: docai_pgdata

networks:
  docai_net:
    name: docai_net
    driver: bridge
